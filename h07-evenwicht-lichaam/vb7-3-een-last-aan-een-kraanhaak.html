<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voorbeeld 7.3 – Een last aan een kraanhaak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500;1,8..60,600&display=swap" rel="stylesheet">

<style>
  .scene canvas{height:auto;aspect-ratio:98/112;max-height:760px;cursor:pointer;touch-action:pan-y}

  .instructie{padding:10px 16px;margin:0 0 14px}

<body>
<div class="wrap">
  <a class="terug" href="../index.html">← Alle animaties</a>
  <header>
    <h1>Voorbeeld 7.3 — Een last aan een kraanhaak</h1>
    <span class="kicker">Evenwicht van een lichaam · een blok met gewicht G hangt met een kabel aan een kraanhaak; gevraagd: de reactiekracht in het punt B</span>
  </header>

  <div class="instructie card">
    <div class="stappen modus" id="stappen"></div>
  </div>

  <div class="main">
    <div class="card scene">
      <canvas id="scene" aria-label="Het blok aan de kabel met de verbinding in A, en eronder het vrijlichaamsdiagram van het blok"></canvas>
      <div class="vldformules" id="vldf"></div>
    </div>
    <div class="side">
      <div class="card panel">
        <h2>Bediening</h2>
        <div class="btnrow" style="margin:0"><button id="aanzicht">standaardaanzicht</button></div>
      </div>
    </div>
  </div>

  <div class="graphs">
    <div class="card graph" data-minhoogte="210">
      <h3 id="rtitel"></h3>
      <canvas id="loep"></canvas>
      <table class="proef" id="proef"></table>
      <div class="stap" id="stap"></div>
    </div>
  </div>
</div>

<script src="../gedeeld/tm1.js"></script>
<script>
(() => {
const { setup, arrow, label, rad } = TM1;
const C = TM1.kleuren();
const KG = '#2f8f46', KA = C.F;                       // kleuren: gewicht G en kabelkracht F_A
const GLOED = 'rgba(255,196,0,';
let stap = 1, anim = null, licht = null, proeven = {}, G = 500, d = 0;

// ---------- vectoren (assen zoals in het handboek: z omhoog, y naar rechts, x naar de kijker) ----------
const V = (x, y, z) => ({ x, y, z });
const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z), sub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
const mul = (a, s) => V(a.x * s, a.y * s, a.z * s), dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const cross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const unit = a => mul(a, 1 / Math.hypot(a.x, a.y, a.z));
const EX = V(1, 0, 0), EY = V(0, 1, 0), EZ = V(0, 0, 1), O = V(0, 0, 0), AS = { x: EX, y: EY, z: EZ };
function rotAx(p, c, a, ang) { const r = sub(p, c), cs = Math.cos(ang), sn = Math.sin(ang); return add(c, add(add(mul(r, cs), mul(cross(a, r), sn)), mul(a, dot(a, r) * (1 - cs)))); }
function loodrecht(a) { const e1 = unit(cross(a, Math.abs(a.z) < 0.9 ? EZ : EX)); return [e1, cross(a, e1)]; }

// ---------- aanzicht ----------
const STANDAARD = { yaw: rad(-30), pitch: rad(16) }, view = { ...STANDAARD };
function cam(p) {                                      // scherm-x = y, omhoog = z, naar de kijker = x
  const q = V(p.y, p.z, p.x), cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const x1 = q.x * cy + q.z * sy, z1 = -q.x * sy + q.z * cy; return V(x1, q.y * cp - z1 * sp, q.y * sp + z1 * cp);
}
const maakP = (cx, cy, S, o = O) => { const P = p => { const q = cam(sub(p, o)); return { x: cx + q.x * S, y: cy - q.y * S }; }; P.S = S; return P; };

// ---------- tekenhulp in 3D ----------
const kleurMix = (hex, f) => { const n = parseInt(hex.slice(1), 16); const k = v => Math.max(0, Math.min(255, Math.round(v * f))); return `rgb(${k(n >> 16)},${k((n >> 8) & 255)},${k(n & 255)})`; };
const LICHT = unit(V(-0.35, 0.75, 0.6));
function poly(ctx, pts, fill, stroke, opt = {}) {
  ctx.save(); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = opt.w || 1.4; ctx.lineJoin = 'round'; if (opt.dash) ctx.setLineDash(opt.dash); ctx.stroke(); }
  ctx.restore();
}
const VLAKKEN = { x0: [0, 2, 6, 4], x1: [1, 5, 7, 3], y0: [0, 4, 5, 1], y1: [2, 3, 7, 6], z0: [0, 1, 3, 2], z1: [4, 6, 7, 5] };
function blok(ctx, P, X, Y, Z, opt = {}) {
  const T = opt.T || (p => p), sn = opt.snede || [], basis = opt.kleur || '#b9c4d0';
  const h = [0, 1, 2, 3, 4, 5, 6, 7].map(k => T(V(X[k & 1], Y[(k >> 1) & 1], Z[(k >> 2) & 1])));
  let mid = O; h.forEach(p => { mid = add(mid, p); }); mid = mul(mid, 1 / 8);
  const info = Object.entries(VLAKKEN).map(([k, idx]) => {
    const p = idx.map(i => h[i]); let n = unit(cross(sub(p[1], p[0]), sub(p[2], p[0]))); let fm = O; p.forEach(q => { fm = add(fm, q); }); fm = mul(fm, 0.25);
    if (dot(n, sub(fm, mid)) < 0) n = mul(n, -1); const nc = cam(n); return { p, k, nc, zicht: nc.z > 1e-6 };
  });
  info.filter(i => !i.zicht).forEach(i => poly(ctx, i.p.map(P), null, '#a3a9b0', { w: 1, dash: [3, 3] }));
  info.filter(i => i.zicht).forEach(i => {
    if (sn.includes(i.k)) poly(ctx, i.p.map(P), '#f3f6f9', '#3d454f', { w: 1.3, dash: [4, 3] });
    else poly(ctx, i.p.map(P), kleurMix(basis, 0.8 + 0.22 * Math.max(0, dot(i.nc, LICHT))), '#3d454f', { w: 1.4 });
  });
}
function lijn3(ctx, P, a, b, kleur, w = 1.4, dash = null) { const p = P(a), q = P(b); ctx.save(); ctx.strokeStyle = kleur; ctx.lineWidth = w; ctx.lineCap = 'round'; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.restore(); }
function pijl3(ctx, P, a, b, kleur, opt = {}) { const p = P(a), q = P(b); return arrow(ctx, p.x, p.y, q.x, q.y, kleur, opt); }
function ring(ctx, P, c, r, as = EY, T = p => p) {
  const [e1, e2] = loodrecht(as); ctx.save(); ctx.strokeStyle = '#3d454f'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i <= 32; i++) { const t = 2 * Math.PI * i / 32, q = P(T(add(c, add(mul(e1, r * Math.cos(t)), mul(e2, r * Math.sin(t)))))); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }
  ctx.stroke(); ctx.restore();
}
function plafond(ctx, P, c, half) {
  const h = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => P(add(c, V(a * half, b * half, 0))));
  poly(ctx, h, '#e4e7eb', '#5b6168', { w: 1.3 });
  ctx.save(); ctx.strokeStyle = '#9aa1aa'; ctx.lineWidth = 1;
  for (let t = 0.15; t < 1; t += 0.17) { const a = { x: h[0].x + (h[1].x - h[0].x) * t, y: h[0].y + (h[1].y - h[0].y) * t }, b = { x: h[3].x + (h[2].x - h[3].x) * t, y: h[3].y + (h[2].y - h[3].y) * t }; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.restore();
}
function boog3(ctx, P, c, a, r, kleur, zin = 1) {
  const [e1, e2] = loodrecht(a), n = 40, pts = [];
  for (let i = 0; i <= n; i++) { const t = zin * (0.15 + 1.45 * Math.PI * i / n); pts.push(P(add(c, add(mul(e1, r * Math.cos(t)), mul(e2, r * Math.sin(t)))))); }
  ctx.save(); ctx.strokeStyle = kleur; ctx.lineWidth = 2.2; ctx.setLineDash([5, 3]); ctx.beginPath(); pts.slice(0, -2).forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.restore();
  const p = pts[n - 3], q = pts[n]; arrow(ctx, p.x, p.y, q.x, q.y, kleur, { w: 2.2, head: 11 });
  lijn3(ctx, P, sub(c, mul(a, r * 1.3)), add(c, mul(a, r * 1.3)), kleur, 1, [2, 3]);
}
function assen(ctx, x, y, L = 24) {
  [[EX, 'x'], [EY, 'y'], [EZ, 'z']].forEach(([e, n]) => { const q = cam(e); arrow(ctx, x, y, x + q.x * L, y - q.y * L, '#6b737d', { w: 1.3, head: 7 }); label(ctx, n, '', x + q.x * (L + 9) - 4, y - q.y * (L + 9) + 4, '#6b737d', { vec: false, size: 13 }); });
}
function punt(ctx, P, p, n, dx = 8, dy = -6) { const q = P(p); ctx.save(); ctx.fillStyle = '#3d454f'; ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, 2 * Math.PI); ctx.fill(); ctx.restore(); label(ctx, n, '', q.x + dx, q.y + dy, C.ink, { vec: false, size: 14 }); }
// kabel van a naar b; is de afstand korter dan de lengte L (in m), dan hangt hij slap door
function kabel(ctx, P, a, b, L, w = 2) {
  const p = P(a), q = P(b), slap = Math.max(0, L - Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z)) * P.S;
  ctx.save(); ctx.strokeStyle = '#3d454f'; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(p.x, p.y);
  ctx.quadraticCurveTo((p.x + q.x) / 2 + slap * 1.2, (p.y + q.y) / 2, q.x, q.y); ctx.stroke(); ctx.restore();
}

// ---------- geometrie ----------
const ZB = 3.0, ZA = 1.2, ZPL = 3.25, HALF = 0.5, LK = ZB - ZA - 0.12;   // hoogtes; LK: lengte van de kabel tot het oogje
const B = V(0, 0, ZB);
// d: uitwijking van de kabel (in graden; stap 5): kabel en blok samen gedraaid rond B (as ∥ x), zodat de kabel schuin
// hangt en C op het verlengde van de kabel ligt
const kant = p => rotAx(p, B, EX, rad(d));
const Apunt = () => kant(V(0, 0, ZA)), Cpunt = () => kant(V(0, 0, ZA - HALF));

// ---------- verbinding A (de kabel aan het blok) en de proefbewegingen van het blok ----------
const BEW = [
  { id: 'zneer', tekst: 'translatie volgens negatieve <i>z</i> (weg van B: de kabel verlengt)', d: mul(EZ, -1), verh: true, kr: ['F', 'A'] },
  { id: 'zop', tekst: 'translatie volgens positieve <i>z</i> (naar B toe: de kabel wordt slap)', d: EZ, verh: false, uit: 'mogelijk → <i>F</i><sub>A</sub> ≥ 0 (een kabel kan enkel trekken)' },
  { id: 'tx', tekst: 'translatie volgens <i>x</i>', d: EX, twee: true, boog: true, verh: false, uit: 'mogelijk: het blok slingert over een cirkelboog rond B → geen kracht ∥ <i>x</i>' },
  { id: 'ty', tekst: 'translatie volgens <i>y</i>', d: EY, twee: true, boog: true, verh: false, uit: 'mogelijk: het blok slingert over een cirkelboog rond B → geen kracht ∥ <i>y</i>' },
  { id: 'rx', tekst: 'rotatie rond <i>x</i>', rot: 'x', twee: true, verh: false, uit: 'mogelijk → geen moment' },
  { id: 'ry', tekst: 'rotatie rond <i>y</i>', rot: 'y', twee: true, verh: false, uit: 'mogelijk → geen moment' },
  { id: 'rz', tekst: 'rotatie rond <i>z</i>', rot: 'z', twee: true, verh: false, uit: 'mogelijk → geen moment' }
];

// ---------- figuur: situatie (boven) en vrijlichaamsdiagram van het blok (onder) ----------
const sc = setup(document.getElementById('scene'));
let raak = null;
function loepCirkel(ctx, q, r) {
  const aan = stap === 2;
  ctx.save();
  if (aan) { ctx.fillStyle = 'rgba(29,92,150,0.16)'; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 2 * Math.PI); ctx.fill(); }
  ctx.strokeStyle = C.accent; ctx.lineWidth = aan ? 3 : 1.6; ctx.setLineDash(aan ? [] : [6, 4]); ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 2 * Math.PI); ctx.stroke();
  const hx = q.x + r * Math.SQRT1_2, hy = q.y + r * Math.SQRT1_2; ctx.setLineDash([]); ctx.lineWidth = aan ? 5 : 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 0.32 * r, hy + 0.32 * r); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.font = '600 15px Inter, sans-serif'; ctx.fillStyle = C.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('A', q.x - (r + 11) * Math.cos(rad(40)), q.y - (r + 11) * Math.sin(rad(40))); ctx.restore();
  raak = { x: q.x, y: q.y, r };
}
function gewicht(ctx, P, Cp, S) { const q = P(Cp), l = G / 500 * 0.9 * S; arrow(ctx, q.x, q.y, q.x, q.y + l, KG, { w: 2.6, head: 11 }); label(ctx, 'G', '', q.x + 6, q.y + l, KG, { vec: true, size: 15 }); }
function drawScene() {
  const ctx = sc.ctx, W = sc.w, Hall = sc.h; ctx.clearRect(0, 0, W, Hall);
  const H = Hall * 0.52;
  const titel = (t, y) => { ctx.save(); ctx.font = '600 11px Inter, sans-serif'; ctx.fillStyle = C.muted; ctx.fillText(t.toUpperCase(), 12, y); ctx.restore(); };
  // ----- boven: situatie -----
  titel('Situatie', 18);
  const S = Math.min(W / 3.6, (H - 44) / 3.7), P = maakP(W / 2, 30 + (H - 30) / 2, S, V(0, 0, (ZPL + ZA - 2 * HALF) / 2));
  const Ap = Apunt(), Cp = Cpunt();
  plafond(ctx, P, V(0, 0, ZPL), 0.6);
  lijn3(ctx, P, V(0, 0, ZPL), V(0, 0, ZB + 0.12), '#3d454f', 2.4); ring(ctx, P, V(0, 0, ZB + 0.02), 0.1);
  lijn3(ctx, P, B, add(Ap, V(0, 0, 0.12)), '#3d454f', 2);
  blok(ctx, P, [-HALF, HALF], [-HALF, HALF], [ZA - 2 * HALF, ZA], { T: kant }); ring(ctx, P, add(Ap, V(0, 0, 0.08)), 0.09);
  punt(ctx, P, B, 'B', 10, 4); punt(ctx, P, Cp, 'C', 8, -4); gewicht(ctx, P, Cp, S);
  if (stap <= 2) loepCirkel(ctx, P(Ap), 0.42 * S); else { raak = null; punt(ctx, P, Ap, 'A', -18, -4); }
  if (stap === 5 && Math.abs(d) > 0.5) {               // schuine kabel: C ligt niet op de verticale door A
    lijn3(ctx, P, Ap, sub(Ap, V(0, 0, 1.3)), '#7a828c', 1.2, [4, 4]);
    ctx.save(); ctx.font = '600 12.5px Inter, sans-serif'; ctx.fillStyle = '#c0392b'; ctx.textAlign = 'right'; ctx.fillText('kabel schuin: geen evenwicht', W - 10, 18); ctx.restore();
  }
  assen(ctx, 28, H - 22);
  // ----- onder: vrijlichaamsdiagram van het blok -----
  ctx.save(); ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(0, H + 0.5); ctx.lineTo(W, H + 0.5); ctx.stroke(); ctx.restore();
  if (stap === 1) { titel('Vrijlichaamsdiagram: kies eerst het vrij te maken lichaam', H + 18); assen(ctx, 28, Hall - 22); return; }
  titel('Vrijgemaakt blok: kabel doorgesneden in A', H + 18);
  const S2 = Math.min(W / 3.8, (Hall - H - 40) / 3.3), Pb = maakP(W / 2, H + 34 + (Hall - H - 40) * 0.55, S2, Cp);
  const kdir = unit(sub(B, Ap));                       // de kabel trekt volgens de kabel, naar B (verticaal als d = 0)
  blok(ctx, Pb, [-HALF, HALF], [-HALF, HALF], [ZA - 2 * HALF, ZA], { T: kant }); punt(ctx, Pb, Cp, 'C', 8, -4); punt(ctx, Pb, Ap, 'A', -18, 4);
  if (stap === 5 && Math.abs(d) > 0.5) {               // hefboomsarm van G t.o.v. A: verticale door A en de vector r_C − r_A
    lijn3(ctx, Pb, add(Ap, V(0, 0, 0.3)), sub(Ap, V(0, 0, 1.3)), '#7a828c', 1.2, [4, 4]);
    pijl3(ctx, Pb, Ap, Cp, C.M, { w: 1.8, head: 9, dash: [4, 3] });
  }
  const qa = Pb(Ap); ctx.save(); ctx.strokeStyle = C.accent; ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(qa.x, qa.y, 0.3 * S2, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
  gewicht(ctx, Pb, Cp, S2);
  const puls = anim ? 0.5 + 0.5 * Math.sin(anim.t * 9) : 1, g = stap === 2 && licht && licht.b === 'zneer' ? puls : 0;
  const tip = add(Ap, mul(kdir, 0.9 * G / 500));
  if (g) pijl3(ctx, Pb, Ap, tip, GLOED + (0.35 + 0.5 * g) + ')', { w: 12, head: 22 });
  pijl3(ctx, Pb, Ap, tip, KA, { w: g ? 3.6 : 2.8, head: g ? 14 : 12 });
  const t = Pb(tip); label(ctx, 'F', 'A', t.x + 6, t.y + 4, KA, { vec: true, size: g ? 17 : 15 });
  if (stap === 2 && licht) {
    const b = BEW.find(x => x.id === licht.b);
    if (b && !b.verh) { const s = b.uit.replace(/<[^>]+>/g, ''); ctx.save(); ctx.font = '600 12.5px Inter, sans-serif'; ctx.fillStyle = '#2f7d3a'; ctx.textAlign = 'center'; ctx.fillText(s, W / 2, Hall - 10); ctx.restore(); }
  }
  assen(ctx, 28, Hall - 22);
}

// ---------- loep op A (stap 2) ----------
const LP = setup(document.getElementById('loep'));
function drawLoep() {
  const ctx = LP.ctx, W = LP.w, H = LP.h; ctx.clearRect(0, 0, W, H);
  if (stap !== 2) return;
  const p0 = V(0, 0, ZA), S = Math.min(W / 2.8, H / 2.5), P = maakP(W / 2, H / 2 + 10, S, add(p0, V(0, 0, 0.1)));
  let T = p => p, zin = 1, boog = null;
  if (anim) {
    const b = anim.b, u = Math.min(anim.t / anim.T, 1), s = b.twee ? Math.sin(2 * Math.PI * u) : Math.sin(Math.PI * u); zin = s < 0 ? -1 : 1;
    const schud = Math.sin(anim.t * 40) * 0.05 * Math.abs(s) + 0.035 * s;
    if (b.rot) T = p => rotAx(p, p0, AS[b.rot], 0.45 * s);
    else if (b.boog) {                                // slingeren: rotatie van het blok rond de as door B (loodrecht op de beweging)
      const as = b.id === 'tx' ? EY : mul(EX, -1), ang = 0.45 * s / (ZB - ZA);
      T = p => rotAx(p, B, as, ang); boog = as;
    } else { const a = b.verh ? schud : 0.4 * s; T = p => add(p, mul(b.d, a)); }
  }
  // de kabel: van het (bewogen) oogje naar boven, richting B (afgeknipt in de loep); slap als het oogje dichter bij B komt
  const oog = T(add(p0, V(0, 0, 0.12))), naarB = unit(sub(B, oog));
  const slap = Math.max(0, LK - Math.hypot(B.x - oog.x, B.y - oog.y, B.z - oog.z));
  const top = add(oog, mul(naarB, 0.95));
  if (boog) {                                         // de cirkelboog rond B die A kan volgen
    const pts = [];
    for (let i = -12; i <= 12; i++) pts.push(P(rotAx(add(p0, V(0, 0, 0.12)), B, boog, i / 12 * 0.5)));
    ctx.save(); ctx.strokeStyle = '#2f7d3a'; ctx.lineWidth = 1.6; ctx.setLineDash([3, 4]); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.restore();
  }
  blok(ctx, P, [-HALF, HALF], [-HALF, HALF], [ZA - 0.6, ZA], { snede: ['z0'], T });
  ring(ctx, P, add(p0, V(0, 0, 0.08)), 0.09, EY, T);
  // de kabel na het blok tekenen: bij een rotatie (bv. rond y, van z naar x) kantelt het blok naar voren en zou het de
  // kabel anders verbergen
  kabel(ctx, P, oog, top, 0.95 + slap, 2.4);
  lijn3(ctx, P, top, add(top, mul(naarB, 0.35)), '#3d454f', 1.4, [3, 4]);   // de kabel loopt verder naar B
  assen(ctx, 26, H - 22);
  if (anim) {
    const b = anim.b, kl = b.verh ? '#c0392b' : '#2f7d3a';
    if (b.rot) boog3(ctx, P, p0, AS[b.rot], 0.55, kl, zin);
    else { const u = mul(b.d, zin); pijl3(ctx, P, add(p0, mul(u, 0.25)), add(p0, mul(u, 0.85)), kl, { w: 2.2, dash: [5, 3], head: 10 }); }
    ctx.save(); ctx.font = '600 14px Inter, sans-serif'; ctx.fillStyle = kl; ctx.textAlign = 'center'; ctx.fillText((b.verh ? '✕ verhinderd' : '✓ mogelijk') + (b.twee ? ' (in beide zinnen)' : ''), W / 2, 18); ctx.restore();
  }
}

// ---------- formules onder het vrijlichaamsdiagram ----------
const kl = (c, s) => `\\textcolor{${c}}{${s}}`;
function render1(el, s) { try { katex.render(s, el, { throwOnError: false }); } catch (e) { el.textContent = s; } }
function vldFormules() {
  const el = document.getElementById('vldf'); if (!window.katex) return;
  if (stap === 1) { el.innerHTML = ''; return; }
  const mk = (id, s) => (stap === 2 && licht && licht.b === id ? `\\colorbox{#ffe08a}{$${s}$}` : s);
  const delen = [`${kl(KG, '\\vec G')} = ${kl(KG, '-G\\,\\vec e_z')}`,
    `${kl(KA, '\\vec F_A')} = ${mk('zneer', kl(KA, 'F_A'))}${kl(KA, '\\,\\vec e_z')}`, mk('zop', `${kl(KA, 'F_A')} \\ge 0`)];
  el.innerHTML = delen.map(() => '<span></span>').join(''); [...el.children].forEach((s, i) => render1(s, delen[i]));
}

// ---------- rechterkaart: inhoud per stap ----------
const $ = id => document.getElementById(id);
const STAPPEN = ['Vrij te maken lichaam', 'Vrijmaken', 'Evenwichtsvergelijkingen', 'Oplossen', 'Interpretatie'];
const ISO = `<div class="kader"><b>Statisch onbepaald (hypostatisch).</b> Geen enkele verbinding verhindert translatie volgens <i>x</i> of <i>y</i>, noch rotatie rond <i>x</i>, <i>y</i> of <i>z</i>: er is maar één beperking (de kabel) voor zes vrijheidsgraden. Het blok kan dus nog bewegen (slingeren, draaien). Toch is er evenwicht, omdat alle krachten op één verticale werklijn liggen.</div>`;
function proefTabel() {
  if (stap !== 2) { $('proef').innerHTML = ''; return; }
  $('proef').innerHTML = BEW.map(b => {
    const uit = !proeven[b.id] ? '<span class="uit nog">nog niet geprobeerd</span>'
      : b.verh ? `<span class="uit verh">✕ verhinderd</span> → <span style="color:${KA}"><span class="i">F</span><sub>A</sub></span>`
      : `<span class="uit vrij">✓</span> ${b.uit}`;
    return `<tr><td><button data-b="${b.id}">▶ probeer</button></td><td>${b.tekst}</td><td>${uit}</td></tr>`;
  }).join('');
  $('proef').querySelectorAll('button').forEach(k => k.onclick = () => {
    const b = BEW.find(x => x.id === k.dataset.b); proeven[b.id] = true;
    anim = { b, t: 0, T: b.twee ? 2.6 : 1.5 }; licht = { b: b.id }; render();
  });
}
function stapInhoud() {
  const el = $('stap'); $('loep').style.display = stap === 2 ? '' : 'none';
  $('rtitel').textContent = stap === 2 ? 'Verbinding A: de kabel aan het blok' : `Stap ${stap}: ${STAPPEN[stap - 1]}`;
  const v = s => `<div class="vgl" data-tex="${s.replace(/"/g, '&quot;')}"></div>`;
  const G_ = kl(KG, '\\vec G'), FA = kl(KA, '\\vec F_A');
  // momentenevenwicht rond A (rel: '=' in evenwicht, '\\neq' als de kabel schuin hangt)
  const MRES = rel => `(\\vec r_A - \\vec r_A)\\times ${FA} + (\\vec r_C - \\vec r_A)\\times ${G_} = (\\vec r_C - \\vec r_A)\\times ${G_} ${rel} \\vec 0`;
  // vectoren in de lopende tekst: inline met KaTeX (dan staan de pijlen correct)
  const t = s => `<span data-tex="${s.replace(/"/g, '&quot;')}"></span>`;
  const RCA = t('\\vec r_C - \\vec r_A'), GV = t(G_), FAV = t(FA);
  let h = '';
  if (stap === 1) h = `<p>We maken enkel het <b>blok</b> vrij: snijd de kabel door in <b>A</b>. Zo wordt de kracht van de kabel op het blok een externe kracht.</p>
      <p>De kabel is gewichtloos: hij brengt de kracht onveranderd over naar de kraanhaak, zodat de gevraagde reactiekracht in B gelijk is aan die in A.</p>
      <p class="noot">Ga daarna naar stap 2 om het blok vrij te maken.</p>`;
  else if (stap === 2) h = `<p class="noot">In de loep zie je enkel de verbinding in A: het blok met zijn oogje en het onderste stukje kabel (de rest van de kabel, naar B, is weggelaten). Enkel de translatie volgens negatieve <i>z</i> is verhinderd.</p>${ISO}
      <p class="noot">Het eigengewicht van de kabel is verwaarloosbaar t.o.v. dat van de last; het blok heeft een gewicht ${t(`${G_} = ${kl(KG, '-G\\,\\vec e_z')}`)} in het zwaartepunt C.</p>`;
  else if (stap === 3) h = `<h4>Krachtenevenwicht (blok)</h4>${v(`${G_} + ${FA} = \\vec 0`)}<h4>Momentenevenwicht rond A</h4>${v(MRES('='))}
      <p class="noot">Er kan enkel evenwicht zijn als het vectorproduct van de hefboomsvector ${RCA} en het gewicht ${GV} gelijk is aan de nulvector. Dat is enkel het geval als de hefboomsvector evenwijdig is met het gewicht.</p>
      <hr style="border:0;border-top:1px solid var(--line);margin:12px 0 4px">
      <h4>Krachtenevenwicht in componenten</h4>
      ${v(`${kl(KG, '\\begin{Bmatrix}0\\\\ 0\\\\ -G\\end{Bmatrix}')} + ${kl(KA, '\\begin{Bmatrix}0\\\\ 0\\\\ F_A\\end{Bmatrix}')} = \\begin{Bmatrix}0\\\\ 0\\\\ 0\\end{Bmatrix}`)}
      <h4>Momentenevenwicht rond A, uitgewerkt met een determinant</h4>
      ${v(`\\begin{vmatrix}\\vec e_x & \\vec e_y & \\vec e_z\\\\ x_C-x_A & y_C-y_A & z_C-z_A\\\\ ${kl(KG, '0')} & ${kl(KG, '0')} & ${kl(KG, '-G')}\\end{vmatrix} = \\vec 0`)}
      ${v(`\\Leftrightarrow\\; \\begin{Bmatrix}-G\\,(y_C-y_A)\\\\ G\\,(x_C-x_A)\\\\ 0\\end{Bmatrix} = \\begin{Bmatrix}0\\\\ 0\\\\ 0\\end{Bmatrix} \\;\\Rightarrow\\; x_C = x_A,\\ \\ y_C = y_A`)}
      <p class="noot">Het zwaartepunt C moet dus op de verticale door A liggen. Dit wil zeggen dat de kabel verticaal moet hangen.</p>`;
  else if (stap === 4) h = `${v(`${FA} = -${G_} = G\\,\\vec e_z \\;\\Rightarrow\\; ${kl(KA, 'F_A')} = G`)}
      <p>De gewichtloze kabel brengt die kracht over naar de kraanhaak: de reactiekracht in B is ${t(`\\vec F_B = ${FA} = -${G_}`)}, naar boven, met grootte ${t(`F_B = ${kl(KA, 'F_A')} = G`)}.</p>
      <h4>Momentenevenwicht rond A</h4>${v(MRES('='))}
      <p class="noot">De kabel hangt verticaal, dus C ligt recht onder A: de hefboomsvector ${RCA} is evenwijdig met het gewicht ${GV} en het vectorproduct is de nulvector.</p>`;
  else h = `<p>Laat de kabel schuin hangen (kabel en blok samen uitgeweken rond B) en kijk naar het momentenevenwicht rond A:</p>
      <div class="slider"><div class="lab"><span>Uitwijking van de kabel</span><b>${d.toFixed(0)}°</b></div><input type="range" id="dd" min="-30" max="30" step="1" value="${d}"></div>
      ${Math.abs(d) > 0.5 ? v(MRES('\\neq'))
          + `<p>Er kan enkel evenwicht zijn als het vectorproduct van de hefboomsvector ${RCA} en het gewicht ${GV} gelijk is aan de nulvector. Dat is enkel het geval als de hefboomsvector evenwijdig is met het gewicht.</p>
             <p>Hangt de kabel schuin, dan ligt C op het verlengde van de kabel maar niet op de verticale door A: de hefboomsvector ${RCA} is niet evenwijdig met ${GV}. Het momentenevenwicht geldt dus niet als de kabel niet verticaal hangt: <b>het systeem kan niet in evenwicht zijn als de kabel schuin hangt</b>.</p>`
        : v(MRES('=')) + `<p class="noot">Nu hangt de kabel verticaal: C ligt recht onder A, de hefboomsvector ${RCA} is evenwijdig met het gewicht ${GV} en er is evenwicht.</p>`}
      <p>In evenwicht hangt de kabel dus verticaal, met A recht onder B: ${GV} en ${FAV} liggen op één verticale werklijn.</p>
      <p class="noot">Er grijpen maar twee krachten aan op het blok (${GV} en ${FAV}): onderdeel 5.3.1 is van toepassing.</p>`;
  el.innerHTML = h;
  if (window.katex) el.querySelectorAll('[data-tex]').forEach(e => render1(e, e.dataset.tex));
  const gg = $('gG'); if (gg) gg.oninput = e => { G = +e.target.value; render(); };
  const dd = $('dd'); if (dd) dd.oninput = e => { d = +e.target.value; render(); };
}
function stapKnoppen() {
  $('stappen').innerHTML = STAPPEN.map((t, i) => `<button data-s="${i + 1}" class="${stap === i + 1 ? 'actief' : ''}"><span class="nr">${i + 1}.</span>${t}</button>`).join('');
  $('stappen').querySelectorAll('button').forEach(b => b.onclick = () => { stap = +b.dataset.s; anim = null; licht = null; if (stap !== 5) d = 0; render(); });
}
function render() { stapKnoppen(); stapInhoud(); proefTabel(); drawScene(); drawLoep(); vldFormules(); }
window.addEventListener('load', () => { vldFormules(); stapInhoud(); });
$('aanzicht').onclick = () => { Object.assign(view, STANDAARD); drawScene(); drawLoep(); };

function sleepbaar(cv, bijKlik) {
  let neer = null;
  cv.addEventListener('pointerdown', e => { neer = { x: e.clientX, y: e.clientY, sleep: false, yaw: view.yaw, pitch: view.pitch }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
  cv.addEventListener('pointermove', e => { if (!neer) return; const dx = e.clientX - neer.x, dy = e.clientY - neer.y;
    if (!neer.sleep && Math.hypot(dx, dy) > 5) neer.sleep = true;
    if (neer.sleep) { view.yaw = neer.yaw + dx * 0.008; view.pitch = Math.max(rad(-10), Math.min(rad(70), neer.pitch + dy * 0.008)); drawScene(); drawLoep(); } });
  cv.addEventListener('pointerup', e => { if (neer && !neer.sleep && bijKlik) bijKlik(e); neer = null; });
  cv.addEventListener('pointercancel', () => { neer = null; });
}
sleepbaar(sc.c, e => {
  const r = sc.c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (raak && Math.hypot(raak.x - x, raak.y - y) < raak.r * 1.3 && stap !== 2) { stap = 2; anim = null; licht = null; render(); }
});
sleepbaar(LP.c, null);

TM1.bijGrootte([sc, LP], render);
TM1.lus(dt => { if (!anim) return; anim.t += dt; if (anim.t >= anim.T) anim = null; drawLoep(); drawScene(); }, () => !!anim);
})();
</script>
